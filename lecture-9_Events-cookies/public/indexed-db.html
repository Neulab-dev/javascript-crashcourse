<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IndexedDB Demo</title>
  </head>
  <body>
    <h1>IndexedDB Demo</h1>

    <div>
      <h2>Add Item</h2>
      <input type="text" id="name" placeholder="Name" />
      <input type="number" id="age" placeholder="Age" />
      <button onclick="addItem()">Add</button>
    </div>

    <div>
      <h2>Items</h2>
      <button onclick="loadItems()">Load Items</button>
      <ul id="itemsList"></ul>
    </div>

    <div>
      <h2>Delete Item</h2>
      <input type="number" id="deleteId" placeholder="Item ID" />
      <button onclick="deleteItem()">Delete</button>
    </div>

    <script>
      const DB_NAME = "DemoDB";
      const STORE_NAME = "items";
      let db;

      function initDB() {
        const request = indexedDB.open(DB_NAME, 1);

        request.onerror = () => console.error("DB init failed");
        request.onsuccess = (event) => {
          db = event.target.result;
        };

        request.onupgradeneeded = (event) => {
          const database = event.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, {
              keyPath: "id",
              autoIncrement: true,
            });
          }
        };
      }

      function addItem() {
        const name = document.getElementById("name").value;
        const age = document.getElementById("age").value;

        if (!name || !age) {
          alert("Fill in all fields");
          return;
        }

        const transaction = db.transaction([STORE_NAME], "readwrite");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.add({ name, age: parseInt(age) });

        request.onsuccess = () => {
          alert("Item added");
          document.getElementById("name").value = "";
          document.getElementById("age").value = "";
        };
      }

      function loadItems() {
        const transaction = db.transaction([STORE_NAME], "readonly");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.getAll();

        request.onsuccess = () => {
          const list = document.getElementById("itemsList");
          list.innerHTML = "";
          request.result.forEach((item) => {
            const li = document.createElement("li");
            li.textContent = `ID: ${item.id}, Name: ${item.name}, Age: ${item.age}`;
            list.appendChild(li);
          });
        };
      }

      function deleteItem() {
        const id = parseInt(document.getElementById("deleteId").value);

        if (!id) {
          alert("Enter item ID");
          return;
        }

        const transaction = db.transaction([STORE_NAME], "readwrite");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.delete(id);

        request.onsuccess = () => {
          alert("Item deleted");
          document.getElementById("deleteId").value = "";
        };
      }

      initDB();
    </script>
  </body>
</html>
